# Base configuration for this paper's task.py run(config).
# The harness merges `task`, `method`, `seed` and `budget_min` on top of
# whatever is here (from the --task/--method/--seed/--budget-min CLI flags),
# so don't rely on this file to set those four keys -- they're always
# overwritten by the CLI invocation.
